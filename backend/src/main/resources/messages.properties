# アプリケーションメッセージ（i18n）

# テナント作成（フェーズ1は運営者専用。POST /api/v1/admin/tenants）
tenant.error.company-code.required=会社コードを入力してください。
tenant.error.company-code.format=会社コードは半角小文字の英数字とハイフンで、3〜63文字で入力してください（先頭・末尾・連続のハイフンは使えません）。
tenant.error.company-code.reserved=この会社コードは使用できません。
tenant.error.company-code.duplicate=この会社コードは既に使われています。
tenant.error.company-name.required=会社名を入力してください。
tenant.error.owner-name.required=氏名を入力してください。
tenant.error.owner-email.required=メールアドレスを入力してください。
tenant.error.owner-email.format=メールアドレスの形式が正しくありません。
tenant.error.password.length=パスワードは8文字以上で入力してください。
tenant.error.password.format=パスワードは半角の英字と数字の両方を含めて入力してください。

# ログイン（POST /api/v1/auth/login・POST /api/v1/auth/refresh）
auth.error.invalid-credentials=メールアドレスまたはパスワードが正しくありません。
auth.error.invalid-token=認証情報が無効です。再度ログインしてください。
auth.error.locked=ログイン試行回数の上限に達したため、一時的にロックされています。しばらくしてから再度お試しください。
auth.error.session-expired=セッションの有効期限が切れました。再度ログインしてください。
auth.error.unauthorized=認証が必要です。ログインしてください。

# 店舗設定（POST /api/v1/stores・GET/PUT /api/v1/stores/{storeId}/settings）
store.error.not-found=指定された店舗が見つかりません。
store.error.forbidden=この操作を行う権限がありません。
store.error.name.required=店名を入力してください。
store.error.seat-count.invalid=席数は0以上で入力してください。
store.error.tax-rounding.invalid=端数処理の設定が不正です。
