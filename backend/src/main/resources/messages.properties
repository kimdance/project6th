# アプリケーションメッセージ（i18n）

# テナント作成（フェーズ1は運営者専用。POST /api/v1/admin/tenants）
tenant.error.company-code.required=会社コードを入力してください。
tenant.error.company-code.format=会社コードは半角小文字の英数字とハイフンで、3〜63文字で入力してください（先頭・末尾・連続のハイフンは使えません）。
tenant.error.company-code.reserved=この会社コードは使用できません。
tenant.error.company-code.duplicate=この会社コードは既に使われています。
tenant.error.company-name.required=会社名を入力してください。
tenant.error.owner-name.required=氏名を入力してください。
tenant.error.owner-email.required=メールアドレスを入力してください。
tenant.error.owner-email.format=メールアドレスの形式が正しくありません。
tenant.error.password.length=パスワードは8文字以上で入力してください。
tenant.error.password.format=パスワードは半角の英字と数字の両方を含めて入力してください。

# ログイン（POST /api/v1/auth/login・POST /api/v1/auth/refresh）
auth.error.invalid-credentials=メールアドレスまたはパスワードが正しくありません。
auth.error.invalid-token=認証情報が無効です。再度ログインしてください。
auth.error.locked=ログイン試行回数の上限に達したため、一時的にロックされています。しばらくしてから再度お試しください。
auth.error.session-expired=セッションの有効期限が切れました。再度ログインしてください。
auth.error.unauthorized=認証が必要です。ログインしてください。

# 現場スタッフの自己登録（POST /api/v1/auth/register）。テナント・オーナーは運営者が
# Postmanで作成済みの前提で、会社コードはURLサブドメインから解決するため画面には持たせない。
user-register.error.name.required=氏名を入力してください。
user-register.error.email.required=メールアドレスを入力してください。
user-register.error.email.format=メールアドレスの形式が正しくありません。
user-register.error.email.duplicate=このメールアドレスは既に登録されています。
user-register.error.password.length=パスワードは8文字以上で入力してください。
user-register.error.password.format=パスワードは半角の英字と数字の両方を含めて入力してください。
user-register.error.role.invalid=選択されたロールでは登録できません。

# パスワード再設定（POST /api/v1/auth/password-reset・.../password-reset/confirm）。
# メールアドレスの登録有無は漏らさないため、request側は常に同じ成功応答を返す（エラーメッセージなし）。
password-reset.error.token.invalid=リンクが無効か、有効期限が切れています。もう一度パスワードの再設定をお申し込みください。
password-reset.error.password.length=パスワードは8文字以上で入力してください。
password-reset.error.password.format=パスワードは半角の英字と数字の両方を含めて入力してください。

# 本人によるプロフィール変更（PUT /api/v1/auth/me）。氏名・メールアドレス・電話番号のみ。
# ロール・所属店舗はここでは変更できない（経営管理者が「ユーザー管理」画面で行う）。
profile.error.name.required=氏名を入力してください。
profile.error.email.required=メールアドレスを入力してください。
profile.error.email.format=メールアドレスの形式が正しくありません。
profile.error.email.duplicate=このメールアドレスは既に使われています。

