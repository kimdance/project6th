spring.application.name=backend
# データベース接続設定 (PostgreSQL / WSL内で稼働)
spring.datasource.url=jdbc:postgresql://localhost:5432/ShopSystemDB
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# JPAの設定
# スキーマ変更は必ず Flyway マイグレーション経由（docs/04_architecture.md §2, §13）。
# Hibernate はスキーマを生成せず、エンティティとの整合のみ検証する。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway（db/migration/V<n>__<desc>.sql を起動前に適用）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# メッセージプロパティの基準名と文字コード指定
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# 運営者によるテナント作成（POST /api/v1/admin/tenants）の合言葉。
# 既定では未設定＝受付は常に拒否（機能オフ）。運営環境で環境変数
# APP_OPERATOR_PROVISION_TOKEN などで設定して有効化する。フェーズ2で運営者認証へ置き換える。
# app.operator.provision-token=

# ログイン（POST /api/v1/auth/login）で発行するJWTの署名鍵・有効期限（04_architecture.md §6.1）。
# secret はこのファイルの値を開発専用とし、本番環境では必ず環境変数 APP_JWT_SECRET で上書きする。
app.jwt.secret=dev-only-please-override-in-production-via-APP_JWT_SECRET
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=14

# ログイン失敗が続いた場合の一時ロック（FR-A08）。
# max-failed-attempts 回連続で失敗すると lock-duration-minutes 分だけロックする。
app.auth.max-failed-attempts=5
app.auth.lock-duration-minutes=15

# 無操作セッションタイムアウト（FR-A09）。ログイン・リフレッシュ成功のたびに最終操作時刻を更新し、
# idle-timeout-minutes 分更新がなければ次のリフレッシュを拒否し再ログインを求める。
app.session.idle-timeout-minutes=30

# 決済手段の接続情報（FR-B05）の暗号化鍵。このファイルの値は開発専用。
# 本番環境では必ず環境変数 APP_CRYPTO_SECRET／APP_CRYPTO_SALT で上書きする。
app.crypto.secret=dev-only-please-override-in-production-via-APP_CRYPTO_SECRET
app.crypto.salt=0123456789abcdef

# パスワードを忘れた場合のリセットメール（FR-A04・EXT-03）。
# 開発環境は Mailpit（docker run -p 1025:1025 -p 8025:8025 axllent/mailpit）宛のSMTPを使い、
# 送信されたメールは認証不要で http://localhost:8025 から確認できる。
# 本番は実際のメール送信サービスの接続情報に置き換える（EXT-03。サービスは未選定のため要検討）。
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# リンクの有効期限（分）と、メール本文に載せるフロントエンドのURL（%s に company_code が入る）。
# 開発環境はViteの既定ポート、本番は環境変数 APP_PASSWORD_RESET_FRONTEND_BASE_URL_TEMPLATE で上書きする。
app.password-reset.expiry-minutes=30
app.password-reset.frontend-base-url-template=http://%s.localhost:5173
app.password-reset.mail-from=no-reply@shop-system.local