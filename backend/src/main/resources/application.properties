spring.application.name=backend
# データベース接続設定 (PostgreSQL / WSL内で稼働)
spring.datasource.url=jdbc:postgresql://localhost:5432/ShopSystemDB
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# JPAの設定
# スキーマ変更は必ず Flyway マイグレーション経由（docs/04_architecture.md §2, §13）。
# Hibernate はスキーマを生成せず、エンティティとの整合のみ検証する。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway（db/migration/V<n>__<desc>.sql を起動前に適用）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# メッセージプロパティの基準名と文字コード指定
spring.messages.basename=messages
spring.messages.encoding=UTF-8